name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build file

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build ARMv7 Cortex-A7 static binaries + package
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/build.sh scripts/verify.sh scripts/package.sh
          ./scripts/build.sh
          ./scripts/verify.sh
          ./scripts/package.sh

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/ggml-arm32-cortexa7-mt6582-android-armv7.tar.gz

  release:
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist
      - name: Publish GitHub Release tarball on tag
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ggml-arm32-cortexa7-mt6582-android-armv7.tar.gz
          body_path: RELEASE_NOTES.md
